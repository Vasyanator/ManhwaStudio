[package]
name = "ms-ai-api"
version = "0.1.0"
edition = "2024"

# The provider-neutral layer over the `genai` multi-provider LLM client ("AI API"): the service
# catalogue (`AiApiService`), API keys in the OS credential store, the authenticated client and
# the async bridge, model metadata (model list, OpenRouter account status), model-id prefix
# rules, base URLs of OpenAI-/Anthropic-compatible servers, the model capability table (image
# input), the quota/limit error classifier and one base64 encoder.
# Consumers (the translation tab's OCR and MT today) build their own chat requests with the
# re-exported `ms_ai_api::genai` types, so the graph keeps exactly one `genai` copy.
#
# It also owns the shared connection widget (`draw_connection`), its GUI-free state and the
# background task runner that executes key and metadata requests, and the cloud image-edit
# layer (`image_edit`: provider and model catalogue, size-rule data, the size-exact
# upscale / decode / downscale / feathered-composite pipeline, HTTP request descriptions).
#
# Layer: one level above `ms-widgets` (uses `ms-i18n`, `ms-log`, `ms-thread`, `ms-theme`,
# `ms-widgets`, `ms-raster`, `egui`, `image`). It must never depend on a tab, `ms-models`,
# `ms-canvas` or `ms-config`.
#
# It also owns live generation progress (`generation`: tracker, streaming executor with a real
# Stop) and its two-line status widget (`generation_view`).
#
# Web build: `genai`, `tokio`, `futures-util`, `keyring` and `ureq` are native-only; the wasm build compiles
# the target-neutral types (including the pure image-edit core) plus error stubs for key
# storage and metadata.
[dependencies]
# Localized error and status texts (`t!` / `tf!`), mounted crate-wide in `lib.rs`.
ms-i18n = { path = "../ms-i18n" }
# Diagnostics for key-store, model-list and account-status failures (never the key itself).
ms-log = { path = "../ms-log" }
# Worker threads for key and metadata requests (Web Workers on wasm).
ms-thread = { path = "../ms-thread" }
# `Severity` of the notices the connection state hands to its consumer's toasts.
ms-theme = { path = "../ms-theme" }
# `WheelComboBox` for the service and model pickers of the connection widget.
ms-widgets = { path = "../ms-widgets" }
# The connection widget draws into an `egui::Ui`.
egui.workspace = true
# Image-edit pipeline: integer upscale / box downscale, mask dilation and feather blur (the one
# owner of each primitive).
ms-raster = { path = "../ms-raster" }
# Image-edit pipeline: PNG encode of the sent image and mask, bounded decode of the provider's
# PNG / JPEG / WebP answer. The workspace entry keeps default features (one copy in the graph).
image.workspace = true
# JSON bodies of image-edit HTTP request descriptions (target-neutral, pure adapters) and the
# native OpenRouter account status / metadata parsing.
serde_json.workspace = true

# Native-only dependencies, matching the root manifest so the graph keeps one copy of each:
# the LLM client (`genai`) with the runtime its futures need (`tokio`), the OS credential
# store (`keyring`), and the blocking HTTP used for the OpenRouter account status and the
# image-edit executor (`image_edit/executor.rs`).
#
# `tokio` adds `macros` here for the `select!` that races every await of the streaming executor
# (`generation.rs`) against the user's Stop; `futures-util` provides `StreamExt::next` over the
# `genai` chat stream (used by this crate alone, so it stays local per the root table's rules;
# the version is the one `genai` already puts in the graph).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
genai.workspace = true
tokio = { workspace = true, features = ["macros"] }
futures-util = "0.3"
keyring.workspace = true
ureq.workspace = true
