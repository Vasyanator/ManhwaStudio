[package]
name = "ms-backend-ipc"
version = "0.1.0"
edition = "2024"

# Framed IPC layer between the Rust application and the Python AI backend.
# GUI-free: no egui, no application config, no domain types — only the wire
# format, the transports and the client.
[dependencies]
# Session logging. Every connection/handshake diagnostic goes through
# `ms_log::runtime_log`; this is the crate's only link back to the app's own layers.
ms-log = { path = "../ms-log" }
# UI strings for backend failures (`t!` / `tf!`), mounted crate-wide via
# `#[macro_use] extern crate ms_i18n;` in `lib.rs`.
ms-i18n = { path = "../ms-i18n" }
# Thread spawning shim (the WS I/O thread and the client's reader thread), so the
# same code compiles for the browser build where `std::thread` is unavailable.
ms-thread = { path = "../ms-thread" }
# The frame header is JSON; `serde_json::Value` is part of this crate's public API
# (`Frame::header`, `BackendClient::call`). No `serde` derive is used.
serde_json.workspace = true
# Timeouts/instants that also work under wasm, matching the rest of the workspace.
web-time.workspace = true

# Native-only: the loopback WebSocket fallback transport used on Windows, where the
# AF_UNIX path is not always available. The wasm build has no backend process at all
# and compiles a stub instead (see `client.rs` / `transport.rs` cfg gates).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

# AF_UNIX sockets on Windows. `std::os::unix::net::UnixStream` has no Windows
# counterpart, so the transport swaps in this crate's `UnixStream` under `cfg(windows)`.
[target.'cfg(windows)'.dependencies]
uds_windows = "1"
