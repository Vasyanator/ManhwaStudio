[package]
name = "ms-memory"
version = "0.1.0"
edition = "2024"

# Image-cache memory policy: the user-selected profile, the OS memory probe, the
# pressure classification and the typed eviction request/report boundary. GUI-free
# and storage-free — it decides WHAT to evict, never owns the pixels.
[dependencies]
# Diagnostics for the OS memory probe (`ms_log::runtime_log`).
ms-log = { path = "../ms-log" }
# `MemoryProfile::label()` is a localized string; the macros are mounted crate-wide
# via `#[macro_use] extern crate ms_i18n;` in `lib.rs`.
ms-i18n = { path = "../ms-i18n" }
# `MemoryProfile` is persisted in `user_config.json`, so it derives Serialize/Deserialize.
serde.workspace = true
