[package]
name = "ms-onnx-runtime"
version = "0.1.0"
edition = "2024"

# Loader that resolves (and, if absent, downloads + verifies + extracts) the official
# ONNX Runtime dynamic library for the current platform/provider, so `ms-onnx` can
# dlopen it. GUI-free and native-only by nature: onnxruntime is a native shared
# library and every path here is blocking I/O meant for a worker thread. It owns
# dylib RESOLUTION only — it never links, initializes or runs onnxruntime.
[dependencies]
# The cache directory lives under `config::data_dir()`.
ms-config = { path = "../ms-config" }
# Diagnostics for probe/download/verify/extract (`ms_log::runtime_log`).
ms-log = { path = "../ms-log" }
# Every user-facing failure string is localized (`t!` / `tf!`); the macros are mounted
# crate-wide via `#[macro_use] extern crate ms_i18n;` in `lib.rs`.
ms-i18n = { path = "../ms-i18n" }
# The capability table: `resolve_or_download_ort_dylib` refuses with the typed
# `Unavailable` where the platform has no native ONNX Runtime (wasm); on Android
# `native_libs` locates the onnxruntime library bundled in the APK.
ms-platform = { path = "../ms-platform" }
# `OrtRuntimeError` carries `ms_onnx` failures and the resolved path is handed to it.
ms-onnx = { path = "../ms-onnx" }
# The pinned release manifest (`ort_manifest.json`) is embedded and parsed into typed
# entries.
serde.workspace = true
serde_json.workspace = true
# The download engine: resumable `.part`, retry with backoff, timeouts, cancel, exact
# size + SHA256 verification (`fetch_verified`) and the per-build busy guard.
ms-download = { path = "../ms-download" }
# The one atomic-write owner: the cache completion marker is replaced through `write_atomic`,
# and every directory fsync (member publish, marker removal) is its `sync_directory`.
ms-atomic-file = { path = "../ms-atomic-file" }
# SHA256 of every extracted library, recorded in the cache completion marker.
sha2.workspace = true
# The archive shapes the official releases ship in: .zip, .tgz (gzip + tar) and
# .tar.zst (zstd + tar).
zip.workspace = true
flate2.workspace = true
tar.workspace = true
zstd.workspace = true

[dev-dependencies]
# The scripted in-memory `RangeFetcher` (`ms_download::test_support`) for the download tests.
ms-download = { path = "../ms-download", features = ["test-support"] }
# Self-removing scratch cache directories for the download tests.
tempfile.workspace = true
