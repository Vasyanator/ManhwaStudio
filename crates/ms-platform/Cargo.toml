[package]
name = "ms-platform"
version = "0.1.0"
edition = "2024"

# GUI-free platform seams for ManhwaStudio: the platform capability table
# (`PlatformFeature`), the async-shaped file-dialog seam, the system clipboard reads, the
# Android credential store (`credentials`) and the pre-window error box. The only crate that names `rfd` and `arboard`; Android backends talk
# to the JVM through `jni`. Compiles on every target (desktop, wasm32, Android): a backend a
# target lacks answers with a typed `Unavailable`, never a fake success.
[features]
# Test-only doors for dependents' tests (`PendingDialog::ready`, `SaveTarget::for_test`,
# `FolderTarget::for_test`). Enabled only from `[dev-dependencies]`, never in a shipped build.
test-support = []

[dependencies]
# Localized user messages of `Unavailable` / `FileDialogError` / `ClipboardError`.
ms-i18n = { path = "../ms-i18n" }
# Dialog outcomes, discarded late results and JNI failures go to the session log.
ms-log = { path = "../ms-log" }
# Typed internal JNI error (`android::jni_ctx::JniBridgeError`).
thiserror.workspace = true

# Native dialog and clipboard backends. Neither has an Android or wasm backend, so they are
# compiled only where `PlatformFeature` reports the matching desktop capability.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
rfd.workspace = true
arboard.workspace = true

# rfd's xdg-portal backend reaches `wayland-sys` through ashpd. Inside the workspace winit
# turns on its `dlopen` feature (no link-time libwayland, no pkg-config); this crate built on
# its own (`-p ms-platform`) would otherwise need the wayland-client dev package and compile a
# second feature variant of the crate. Same cfg as rfd's ashpd dependency.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
wayland-sys = { version = "0.31", features = ["dlopen"] }

# Android: the application context and JavaVM that android-activity publishes through
# `ndk-context`, used by the clipboard reads, the SAF file-dialog bridge, the incoming-images
# inbox, the credential store bridge and the native library directory query.
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
ndk-context.workspace = true

[dev-dependencies]
# Reads the embedded locale catalogs to prove every message key exists in `en` and `ru`.
serde_json.workspace = true
