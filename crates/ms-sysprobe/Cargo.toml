[package]
name = "ms-sysprobe"
version = "0.1.0"
edition = "2024"

# Host-environment probes: GPU/accelerator detection, app-local Python runtime
# discovery, desktop region capture, installed-AI-package classification. GUI-free;
# no probe reads or writes a config document.
[dependencies]
# Diagnostics for the capture path (`ms_log::runtime_log`). The only link back to the
# application's own layers.
ms-log = { path = "../ms-log" }
# `ai_install_probe` classifies a machine into the persisted `AiInstallType` level, which
# is declared there; `amd_adapters` / `gpu_utils` name the shared `torch_choice::GfxArch`
# processor type. No module reads a config document.
ms-config = { path = "../ms-config" }
# `ai_install_probe` runs its shell probe on a background thread and must stay
# target-neutral about how one is created.
ms-thread = { path = "../ms-thread" }
# User-facing failure strings (`t!` / `tf!`), mounted crate-wide via
# `#[macro_use] extern crate ms_i18n;` in `lib.rs`.
ms-i18n = { path = "../ms-i18n" }
# `RgbaImage` is the public capture contract of `screen_capture`, and the module also
# decodes the PNG/PPM output of the Linux/macOS capture tools with it.
image.workspace = true
# JSON output of the platform probes (`hyprctl -j`, `wlr-randr --json`); the AI probe's
# Python snippet returns a typed JSON report, hence the derive.
serde.workspace = true
serde_json.workspace = true
# `ai_models::external` verifies every pinned external-model file against its sha256.
sha2.workspace = true
# Typed public error of `ai_models::external` (`ExternalModelError`).
thiserror.workspace = true
# Platform seams: the system clipboard behind `paste_image`, the capability table
# (`PlatformFeature`) that decides which host probes and stores exist on this target, and
# the Android credential store of the Hugging Face token (`credentials`).
ms-platform = { path = "../ms-platform" }

# Native-only half of `ai_models`: it builds Hugging Face resolve URLs itself and streams
# each file with resumable ranged requests (no HF cache). Compiled out on wasm, where the module
# keeps its signatures and returns a typed "unavailable on web" error.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The resumable, retrying per-file HTTP stream and the per-spec busy guard both `ai_models`
# downloaders use; each file goes into the app model tree (no HF cache blobs or symlinks).
ms-download = { path = "../ms-download" }

# The OS secret store `hf_token` keeps the access token in. Not on wasm (no store) and not
# on Android: keyring has no Android backend there and would silently link its in-memory
# mock, so `hf_token` uses the Keystore-backed `ms_platform::credentials` store instead.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
keyring.workspace = true

# Windows GDI screen capture, the Job Object that kills spawned Python children with the
# parent process, and the AMD adapter probe (`amd_adapters`: SetupAPI display-class
# enumeration -> `Win32_Devices_DeviceAndDriverInstallation`; the driver key's
# `DriverVersion` -> `Win32_System_Registry`). Feature list is exactly what these modules use.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Registry"] }

[dev-dependencies]
# Unique, self-removing scratch directories for the `ai_models::external` download tests.
tempfile.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The scripted in-memory `RangeFetcher` (`ms_download::test_support`) for the main-repository
# downloader tests (`ai_models/main_repo_tests.rs`).
ms-download = { path = "../ms-download", features = ["test-support"] }
