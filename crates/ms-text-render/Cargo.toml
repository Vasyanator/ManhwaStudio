[package]
name = "ms-text-render"
version = "0.1.0"
edition = "2024"

# The production text renderer for the typing tab, extracted from
# src/tabs/typing/render_next. GUI-free: shaping/layout via cosmic-text, vector
# glyph rasterization via zeno, RGBA output via the image crate.
[dependencies]
web-time.workspace = true
ms-log = { path = "../ms-log" }
ms-text-util = { path = "../ms-text-util" }
# The one exact Euclidean distance transform (glow and dry-media effects call it through the
# adapters in src/effects/image_ops.rs).
ms-raster = { path = "../ms-raster" }
# The bundled `fonts/ui` stack: the renderer builds its own deterministic fontdb
# base out of it instead of loading the operating system's fonts
# (see src/font_base.rs and dev-docs/unicode_base_font_plan.md, decision 1).
ms-fonts = { path = "../ms-fonts" }
cosmic-text.workspace = true
# `cosmic_text::Fallback` names writing systems with `unicode_script::Script` and
# cosmic-text does not re-export the type, so it has to be a direct dependency.
# Already in the tree at this version as cosmic-text's own dependency, so it adds
# no build cost and pins nothing new.
unicode-script.workspace = true
swash.workspace = true
zeno.workspace = true
hyphenation.workspace = true
image.workspace = true
rayon.workspace = true
serde_json.workspace = true

# Dependencies of the diagnostic programs in `examples/` only (see
# `examples/MODULE_README.md`); the library itself stays GUI-free.
[dev-dependencies]
# The egui preview windows of `text_render_test` and `test_text_shape`.
eframe.workspace = true
# `text_render_test`: dark theme of its window and the non-blocking PNG save dialog.
ms-theme = { path = "../ms-theme" }
ms-platform = { path = "../ms-platform" }
# `text_render_test`: aggregated error of its `main`.
anyhow.workspace = true

# The golden-image harness carries self-check `#[test]`s (`rgba_diff`); examples are not
# test targets by default, so `cargo test -p ms-text-render` runs them only with this.
[[example]]
name = "render_gallery"
path = "examples/render_gallery/main.rs"
test = true
