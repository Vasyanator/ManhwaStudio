[package]
name = "ms-theme"
version = "0.1.0"
edition = "2024"

# The single owner of the egui GLOBAL style and of the studio's semantic colours: `base_style`
# (egui's stock dark theme plus the status colours), `install` (the only global-style writer
# in the workspace), the scoped temporary style, the editing chrome drawn over page images,
# the modal scrim and the transparency checkerboard; everything else is plain `const` data.
#
# Layer: a LEAF. It depends on egui alone, has no I/O and no state, so any UI crate (canvas,
# tools, tabs, settings UI, installer, the launcher, the binary) may depend on it. It must
# never depend on another workspace crate. The launcher layers its own palette
# (`crates/ms-launcher/src/theme.rs`) over `base_style()`.
[dependencies]
# `Color32`, `Visuals`, `Painter`, `ColorImage` and the texture the checkerboard tiles from.
egui.workspace = true
